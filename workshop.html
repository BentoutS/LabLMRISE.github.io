html{scroll-behavior:smooth;scroll-padding-top:80px}

nav{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:46px;width:46px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}
.links{display:flex;gap:26px;align-items:center}
.links a{color:rgba(255,255,255,.78);font-size:14px;font-weight:500}.links a:hover{color:var(--mint)}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:rgba(255,255,255,.7);font:600 12px var(--sans);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button.active{background:var(--copper);color:#fff}

.hero .wrap{position:relative}
.tag{display:inline-flex;gap:8px;align-items:center;background:rgba(159,232,216,.12);border:1px solid rgba(159,232,216,.35);color:var(--mint);padding:6px 16px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.12em}

.hero h1 em{font-style:italic;color:var(--mint)}
.hero .lede{font-size:18px;color:rgba(255,255,255,.78);max-width:640px;margin-bottom:34px}
.facts{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:34px}

.fact small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);font-weight:600}
.fact b{font-family:var(--serif);font-size:19px;font-weight:600}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:46px}

.btn:hover{transform:translateY(-2px)}
.btn-c{background:var(--copper);color:#fff}.btn-c:hover{background:#c9692f}
.btn-o{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}.btn-o:hover{border-color:var(--mint);color:var(--mint)}
.count{display:flex;gap:12px}

.count span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}

.head{max-width:680px;margin-bottom:44px}

.theme{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 22px;transition:transform .25s,box-shadow .25s}
.theme:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(6,32,30,.1)}
.ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--forest),var(--teal));display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme h3{font-size:20px;margin-bottom:6px}.theme p{font-size:14px;color:var(--muted)}
.alt{background:var(--sand2)}
.chairs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.chair{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;border-top:4px solid var(--teal)}
.chair.hl{background:var(--forest);color:#fff;border-color:var(--copper);border-top-color:var(--copper)}
.chair small{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.chair.hl small{color:var(--mint)}
.chair h3{font-size:21px;margin:10px 0 6px}.chair p{font-size:14px;color:var(--muted)}.chair.hl p{color:rgba(255,255,255,.75)}

.grp{margin-top:26px;display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:22px;color:var(--forest)}
.grp:first-child{margin-top:0}.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp i{font-style:normal;font-family:var(--sans);font-size:12px;font-weight:600;color:#fff;background:var(--copper);border-radius:999px;padding:3px 12px;letter-spacing:.1em}
.row{display:grid;grid-template-columns:150px 1fr;gap:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;align-items:start}
.row .t{font-weight:600;font-size:14px;color:var(--teal);font-variant-numeric:tabular-nums;padding-top:3px}
.row h3{font-size:18px;font-family:var(--sans);font-weight:600}
.row ul{margin-top:8px}.row li{font-size:14.5px;color:var(--muted);padding-inline-start:18px;position:relative;margin-bottom:4px}
.row li::before{content:"";position:absolute;inset-inline-start:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--copper)}
.row.pause{background:transparent;border-style:dashed}.row.pause h3{font-weight:500;color:var(--muted)}
.partners{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.partners span{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--forest);background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 34px}
.coms{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.com{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px}
.com h3{font-size:24px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--copper);display:inline-block}
.com li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.com li:last-child{border:0}

.cta{background:linear-gradient(135deg,var(--forest),var(--ink));color:#fff;border-radius:26px;padding:54px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}

.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}

html[lang="ar"] body,html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] .btn,html[lang="ar"] .lang button{font-family:'Cairo',sans-serif}
